<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#4a2e26" />
<link rel="manifest" href="manifest.webmanifest" />
<link rel="icon" href="icon-192.png" />
<link rel="apple-touch-icon" href="apple-touch-icon.png" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-title" content="WH Admin" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="robots" content="noindex,nofollow" />
<title>Wealthy Health Bookings</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
/* Owner dashboard. Same palette and type as the website: night, ember, linen. One family. */
:root{
  --night:#fffdf9;--card:#ffffff;--card2:#f5eee6;--line:rgba(74,46,38,.16);--fg:#3a2620;--mut:rgba(58,38,32,.68);
  --accent:#b4480f;--gold:#8c4a24;--ok:#3f7d5a;--bad:#b3402a;
  --sans:'Public Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{background:var(--night);color:var(--fg);font:400 15px/1.5 var(--sans);min-height:100vh;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;touch-action:manipulation}
a{color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
input,select{font:inherit;color:inherit;background:none;border:0;border-bottom:1px solid var(--line);padding:.6em 0;width:100%;border-radius:0;color-scheme:light}
input:focus,select:focus{outline:0;border-bottom-color:var(--gold)}
select option{background:#fff;color:#12283a}
label{display:block;font-size:10.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--mut);margin-bottom:2px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.6em;padding:.85em 1.5em;border:1px solid var(--line);border-radius:999px;text-decoration:none;
  font:500 12px/1 var(--sans);letter-spacing:.16em;text-transform:uppercase;transition:background .3s,color .3s,border-color .3s,opacity .3s}
.btn:hover{border-color:var(--fg)}
.btn--solid{background:var(--fg);color:var(--night);border-color:var(--fg)}
.btn--solid:hover{background:var(--accent);border-color:var(--accent)}
.btn--ok{border-color:var(--ok);color:var(--ok)}.btn--ok:hover{background:var(--ok);color:var(--night)}
.btn--bad{border-color:rgba(180,87,62,.5);color:var(--bad)}.btn--bad:hover{background:var(--bad);color:var(--night);border-color:var(--bad)}
.btn[disabled]{opacity:.4;pointer-events:none}

/* login */
.login{min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(60vmax 40vmax at 50% 0,rgba(180,72,15,.08),transparent 60%)}
.login__card{width:min(100%,400px);display:grid;gap:22px}
.login h1{font:300 clamp(2rem,8vw,2.8rem)/1.05 var(--sans);letter-spacing:-.03em}
.login h1 em{color:var(--gold);font-style:italic}
.login small{color:var(--mut)}
.err{color:var(--bad);font-size:13px;min-height:1.3em}

/* app shell */
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px clamp(16px,4vw,40px);background:rgba(255,253,249,.94);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.brand{font:500 12px/1 var(--sans);letter-spacing:.3em;text-transform:uppercase}
.brand i{color:var(--gold);font-style:normal;opacity:.8}
.live{display:inline-flex;align-items:center;gap:8px;font-size:12px;color:var(--mut)}
.live::before{content:'';width:8px;height:8px;border-radius:50%;background:var(--ok);animation:pulse 2.2s ease-in-out infinite}
.live.off::before{background:var(--bad);animation:none}
@keyframes pulse{50%{opacity:.35;transform:scale(1.3)}}
main{max-width:980px;margin:0 auto;padding:clamp(18px,4vw,40px) clamp(16px,4vw,40px) 80px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:22px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px 18px}
.stat b{display:block;font:300 clamp(2rem,6vw,3rem)/1 var(--sans);letter-spacing:-.03em}
.stat span{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--mut)}
.stat.hot b{color:var(--accent)}
.tabs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin-bottom:22px;padding-bottom:2px}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;padding:.7em 1.2em;border:1px solid var(--line);border-radius:999px;font-size:13px;white-space:nowrap;transition:background .3s,color .3s}
.tab[aria-selected="true"]{background:var(--fg);color:var(--night);border-color:var(--fg)}
.tab em{font-style:normal;margin-left:6px;opacity:.65}
.day{font-size:11px;letter-spacing:.24em;text-transform:uppercase;color:var(--gold);margin:26px 0 10px}
.day:first-child{margin-top:0}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px 20px;display:grid;gap:14px;margin-bottom:10px;animation:in .5s cubic-bezier(.22,1,.36,1) both}
.card.fresh{border-color:var(--accent);box-shadow:0 0 0 3px rgba(180,72,15,.18)}
@keyframes in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.card__head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.time{font:300 clamp(1.6rem,5vw,2.2rem)/1 var(--sans);letter-spacing:-.03em}
.time small{font-size:13px;letter-spacing:0;color:var(--mut);margin-left:8px}
.pill{font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;padding:.45em .9em;border-radius:999px;border:1px solid currentColor;white-space:nowrap}
.pill.new{color:var(--accent)}.pill.confirmed{color:var(--ok)}.pill.done{color:var(--mut)}.pill.cancelled,.pill.declined{color:var(--bad)}
.svc{font-size:17px}
.meta{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:8px 24px;font-size:14px}
.meta div span{display:block;font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--mut)}
.actions{display:flex;flex-wrap:wrap;gap:8px}
.empty{color:var(--mut);padding:40px 0;text-align:center}
.panel{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:22px;display:grid;gap:18px;margin-bottom:14px}
.panel h2{font:300 22px/1.1 var(--sans);letter-spacing:-.02em}
.row2{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:16px 24px}
.check{display:flex;gap:12px;align-items:flex-start;font-size:15px}
.check input{width:20px;height:20px;margin-top:2px;accent-color:var(--accent)}
.check span small{display:block;color:var(--mut);font-size:13px}
.blk{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 0;border-top:1px solid var(--line);font-size:14px}
.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,30px);z-index:50;background:var(--fg);color:var(--night);padding:.9em 1.5em;border-radius:999px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .4s,transform .6s cubic-bezier(.22,1,.36,1);max-width:92vw;text-align:center}
.toast.on{opacity:1;transform:translate(-50%,0)}
@media (max-width:520px){.stats{gap:8px}.stat{padding:12px 14px}.card{padding:16px}}

/* ===== installed app feel ===== */
html{-webkit-tap-highlight-color:transparent;overscroll-behavior-y:none}
body{padding-top:env(safe-area-inset-top)}
.top{padding-top:calc(14px + env(safe-area-inset-top))}
.top .btn{min-height:44px;padding:.5em 1.1em}
.apbtn{display:none}
.apbtn.show{display:inline-flex}
.ioshint{display:none;margin:0 0 16px;padding:14px 16px;border:1px solid var(--line);border-radius:12px;background:var(--card);font-size:14px;color:var(--mut)}
.ioshint.show{display:block}
@media (max-width:720px){
  main{padding-bottom:calc(96px + env(safe-area-inset-bottom))}
  .tabs{position:fixed;left:0;right:0;bottom:0;z-index:40;margin:0;padding:10px 10px calc(10px + env(safe-area-inset-bottom));background:var(--card);border-top:1px solid var(--line);box-shadow:0 -8px 24px rgba(74,46,38,.1)}
  .tab{min-height:46px;padding:.6em 1.1em;font-size:14px}
  .toast{bottom:calc(90px + env(safe-area-inset-bottom))}
}
@media (display-mode:standalone){.ioshint,.apbtn{display:none!important}}
.top .btn{white-space:nowrap}

/* ===== clearer layout, buttons and type ===== */
body{font-size:16px}
label{font-size:14px;font-weight:600;letter-spacing:0;text-transform:none;color:var(--fg);margin-bottom:6px}
input,select{background:#fff;border:1.5px solid #cdbfb4;border-radius:10px;padding:.7em .9em;min-height:50px;font-size:16px}
input:focus,select:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(180,72,15,.16)}
.btn{min-height:48px;padding:.7em 1.4em;border:1.5px solid #cdbfb4;border-radius:10px;font:600 15px/1.2 var(--sans);letter-spacing:0;text-transform:none;background:#fff}
.btn:hover{border-color:var(--fg)}
.btn--solid{background:var(--fg);border-color:var(--fg);color:#fff}
.btn--solid:hover{background:#2a1a15;border-color:#2a1a15}
.btn--ok{background:var(--ok);border-color:var(--ok);color:#fff}.btn--ok:hover{background:#2f6747;color:#fff}
.btn--bad{background:#fff;border-color:var(--bad);color:var(--bad)}.btn--bad:hover{background:var(--bad);color:#fff}
/* login */
.login__card{width:min(100%,380px);gap:18px}
.login h1{font:700 1.6rem/1.15 var(--sans);letter-spacing:-.01em;text-align:center}
.login .btn{width:100%;margin-top:4px}
/* header */
.top{padding-block:10px;min-height:68px}
.brand{display:flex;align-items:center;gap:12px;font:700 16px/1.15 var(--sans);letter-spacing:0;text-transform:none}
.brand img{height:30px;width:auto}
.brand small{display:block;font:500 13px/1.2 var(--sans);color:var(--mut)}
.top>span:last-child{display:flex;align-items:center;gap:10px}
.top .btn{min-height:44px;padding:.5em 1.1em;font-size:14px}
.live{font-weight:600;color:var(--bad)}
.live::before{background:var(--bad)}
/* summary + tabs */
.stat span{font-size:14px;letter-spacing:0;text-transform:none;color:var(--mut);font-weight:500}
.stat b{font-weight:700}
.stat.hot{border-color:var(--accent)}
.tabs{gap:8px;margin-bottom:24px}
.tab{min-height:46px;padding:.6em 1.2em;font-size:15px;font-weight:600;color:var(--fg);background:#fff;border:1.5px solid #cdbfb4;border-radius:10px}
.tab[aria-selected="true"]{background:var(--fg);color:#fff;border-color:var(--fg)}
/* booking cards */
.day{font-size:15px;font-weight:700;letter-spacing:0;text-transform:none;color:var(--fg);margin:28px 0 12px}
.card{border-radius:14px;padding:20px;gap:16px}
.time{font-weight:700}
.time small{font-size:14px}
.svc{font-size:17px;font-weight:600}
.pill{font-size:13px;font-weight:600;letter-spacing:0;text-transform:capitalize;padding:.4em .9em}
.meta{grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px 24px}
.meta div span{font-size:13px;letter-spacing:0;text-transform:none;font-weight:600;color:var(--mut)}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.actions .btn{width:100%}
.panel{border-radius:14px}
.panel h2{font-weight:700;font-size:20px}
.empty{font-size:16px}
@media (min-width:721px){.actions{display:flex;flex-wrap:wrap}.actions .btn{width:auto;min-width:130px}}
@media (max-width:720px){.brand small{display:none}.top .btn.apbtn{display:none}.top .btn.apbtn.show{display:inline-flex}}
@media (min-width:721px){.tabs{flex-wrap:wrap;overflow:visible}}

/* assistant */
.asopen{position:fixed;right:16px;bottom:20px;z-index:45;min-height:52px;padding:0 22px;border-radius:26px;background:var(--accent);color:#fff;font:600 16px/1 var(--sans);box-shadow:0 10px 28px rgba(74,46,38,.3)}
.asopen[hidden],.aspan[hidden]{display:none!important}
.aspan{position:fixed;right:16px;bottom:16px;z-index:60;width:min(420px,calc(100vw - 32px));height:min(620px,calc(100vh - 32px));display:flex;flex-direction:column;background:#fff;border:1px solid var(--line);border-radius:16px;box-shadow:0 24px 60px rgba(74,46,38,.3);overflow:hidden}
.aspan__h{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;background:var(--fg);color:#fff;font-size:16px}
.aspan__h button{color:#fff;font-weight:600;min-height:40px;padding:0 10px}
.aspan__log{flex:1;overflow:auto;padding:14px;display:flex;flex-direction:column;gap:10px;background:var(--night)}
.as__m{max-width:92%;padding:10px 14px;border-radius:14px;background:#fff;border:1px solid var(--line);font-size:15px;line-height:1.45;align-self:flex-start}
.as__m.me{align-self:flex-end;background:var(--fg);color:#fff;border-color:var(--fg)}
.as__m ul{padding-left:18px}.as__m li{margin:3px 0}
.as__m small{color:var(--mut)}
.as__d{font-size:13px;font-weight:600;color:var(--mut);margin:8px 0 2px}
.as__b{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line);font-size:14px}
.as__b em{font-style:normal;font-size:12px;white-space:nowrap}
.as__a{flex:none;font-weight:600;color:var(--ok);padding:6px 0;text-decoration:underline}
.as__y{display:flex;gap:8px;margin-top:10px}
.as__y button,.aspan__q button{min-height:44px;padding:0 14px;border:1.5px solid #cdbfb4;border-radius:10px;font-weight:600;background:#fff;font-size:14px}
.as__y button:first-child{background:var(--fg);color:#fff;border-color:var(--fg)}
.aspan__q{display:flex;gap:8px;overflow-x:auto;padding:10px 12px;border-top:1px solid var(--line);scrollbar-width:none}
.aspan__q button{flex:none}
.aspan__f{display:flex;gap:8px;padding:10px 12px calc(10px + env(safe-area-inset-bottom));border-top:1px solid var(--line)}
.aspan__f input{flex:1;min-width:0}
@media (max-width:720px){
  .asopen{bottom:calc(84px + env(safe-area-inset-bottom))}
  .aspan{inset:0;width:100%;height:100%;border-radius:0;border:0}
}

.asmic{flex:none;min-height:50px;padding:0 16px;border-radius:10px;border:1.5px solid var(--accent);color:var(--accent);font-weight:600;background:#fff;font-size:15px}
.asmic.on{background:var(--accent);color:#fff}
.asmic[hidden],#asVoice[hidden]{display:none}
#asVoice{font-size:13px}
.aspan__h span{display:flex;align-items:center;gap:6px}

.aspan__v{display:flex;align-items:center;gap:8px;padding:8px 12px;border-bottom:1px solid var(--line);background:#fff}
.aspan__v label{margin:0;font-size:14px}
.aspan__v select{min-height:44px;padding:.3em .6em;font-size:14px}
.aspan__v #asVoiceSel{flex:1;min-width:0}
.aspan__v[hidden]{display:none}

/* ===== side menu layout ===== */
.tabs{display:none!important}
main{padding-bottom:96px}
.top{justify-content:flex-start;gap:12px;padding-inline:12px}
.top__t{font:700 20px/1.2 var(--sans);letter-spacing:-.01em;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.burger{flex:none;width:48px;height:48px;border:1.5px solid #cdbfb4;border-radius:10px;background:#fff;display:grid;place-items:center}
.burger span,.burger span::before,.burger span::after{display:block;width:22px;height:2px;background:var(--fg);border-radius:2px;position:relative;transition:transform .25s,background .2s}
.burger span::before,.burger span::after{content:'';position:absolute;left:0}
.burger span::before{top:-7px}.burger span::after{top:7px}
.burger.on span{background:transparent}
.burger.on span::before{transform:translateY(7px) rotate(45deg)}
.burger.on span::after{transform:translateY(-7px) rotate(-45deg)}
.scrim{position:fixed;inset:0;z-index:70;background:rgba(40,24,18,.5);opacity:0;transition:opacity .25s}
.scrim.on{opacity:1}
.drawer{position:fixed;top:0;bottom:0;left:0;z-index:80;width:min(320px,86vw);display:flex;flex-direction:column;background:#fff;box-shadow:12px 0 40px rgba(40,24,18,.2);
  transform:translateX(-102%);transition:transform .28s cubic-bezier(.22,1,.36,1);visibility:hidden;padding-top:env(safe-area-inset-top)}
.drawer.open{transform:none;visibility:visible}
.drawer.drag{transition:none;visibility:visible}
.drawer__h{display:flex;align-items:center;gap:12px;padding:20px 20px 16px;border-bottom:1px solid var(--line)}
.drawer__h img{height:30px;width:auto}
.drawer__h b{display:block;font-size:17px}
.drawer__h small{color:var(--mut);font-size:14px}
.drawer__nav{flex:1;overflow:auto;padding:12px}
.drawer__nav button{display:flex;align-items:center;justify-content:space-between;width:100%;min-height:54px;padding:0 16px;margin-bottom:4px;border-radius:12px;font:600 17px/1 var(--sans);text-align:left;color:var(--fg)}
.drawer__nav button:hover{background:var(--card2)}
.drawer__nav button.on{background:var(--fg);color:#fff}
.drawer__nav em{font-style:normal;min-width:26px;height:26px;padding:0 8px;border-radius:13px;display:inline-grid;place-items:center;background:var(--accent);color:#fff;font-size:14px;font-weight:700}
.drawer__nav em[hidden],.drawer__nav em:empty{display:none}
.drawer__f{display:grid;gap:10px;padding:14px 16px calc(16px + env(safe-area-inset-bottom));border-top:1px solid var(--line)}
.drawer__f .btn{width:100%}
.drawer__f .apbtn{display:none}
.drawer__f .apbtn.show{display:inline-flex}
@media (min-width:1000px){
  /* wide screens: menu stays open on the left, no swiping needed */
  .burger,.scrim{display:none!important}
  .drawer{transform:none;visibility:visible;box-shadow:none;border-right:1px solid var(--line)}
  #appView{padding-left:320px}
  .top{padding-left:24px}
}
@media (max-width:720px){main{padding-bottom:96px}.asopen{bottom:calc(20px + env(safe-area-inset-bottom))}}

/* ---- admin home: week strip + inbox ---- */
.stats{display:none!important}
.wk__h{display:flex;align-items:center;gap:8px;margin:0 0 10px}.wk__h b{flex:1;text-align:center;font-size:15px}
.wk__n{width:44px;height:44px;border:1.5px solid #cdbfb4;border-radius:12px;background:#fff;font-size:22px;line-height:1}
.wk__t{min-height:44px;padding:0 14px;border:0;border-radius:12px;background:var(--fg);color:#fff;font-weight:700;font-size:14px}
.wk{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-bottom:14px}
.wk__d{padding:8px 0;min-height:64px;border-radius:14px;border:1.5px solid var(--line);background:#fff;font-size:12px;color:var(--mut);text-align:center}
.wk__d b{display:block;font-size:18px;color:var(--fg)}.wk__d u{display:block;width:6px;height:6px;border-radius:50%;background:var(--accent);margin:3px auto 0}
.wk__d.td:not(.on){border-color:var(--accent)}.wk__d.on{background:var(--fg);border-color:var(--fg);color:#d9c9be}.wk__d.on b{color:#fff}
.seg{display:flex;padding:4px;border-radius:14px;background:var(--card2);margin-bottom:14px}
.seg button{flex:1;min-height:44px;border-radius:11px;font-weight:700;font-size:14px;color:var(--mut);background:none;border:0}
.seg button.on{background:#fff;color:var(--fg);box-shadow:0 2px 6px rgba(0,0,0,.08)}
.seg em{font-style:normal;font-size:12px;margin-left:2px}.seg .hot em{background:var(--accent);color:#fff;border-radius:9px;padding:1px 7px}
.hl .hint{font-size:13px;color:var(--mut);margin:0 0 10px}
.sw{position:relative;margin-bottom:10px;border-radius:16px;overflow:hidden;touch-action:pan-y}
.sw__act{position:absolute;inset:0;background:var(--ok);color:#fff;display:flex;align-items:center;padding-left:20px;font-weight:700}
.sw.go .sw__act{background:#2f6b49}
.hrow{position:relative;display:grid;grid-template-columns:64px 1fr auto;gap:12px;align-items:center;padding:14px 16px;border-radius:16px;background:#fff;border:1px solid var(--line);cursor:pointer;transition:transform .2s}
.hrow__t{font-weight:800;font-size:17px;line-height:1.1}.hrow__t small{display:block;font-weight:500;color:var(--mut);font-size:12px}
.hrow__m{min-width:0}.hrow__m b{display:block}.hrow__m p{font-size:13px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.asopen{display:flex;align-items:center;gap:8px}.asopen::before{content:'✦'}

/* ---- polish ---- */
.greet{display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:center;padding:18px;margin-bottom:16px;border-radius:20px;background:linear-gradient(135deg,#4a2e26,#6b4034);color:#f7ece0}
.greet__lo{display:grid;place-items:center;width:52px;height:52px;border-radius:50%;background:rgba(255,255,255,.12);color:#f2b27a}
.greet h2{font:700 19px/1.2 var(--sans)}.greet p{font-size:14px;margin-top:3px;color:#ecd9c8}.greet p b{color:#fff}.greet small{display:block;font-size:12px;margin-top:6px;color:#d3b9a4}
.ring{position:relative;width:64px;height:64px;display:grid;place-items:center;border-radius:50%}.ring svg{position:absolute;inset:0}.ring span{font-weight:800;font-size:13px;color:#fff;position:relative}
.av{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:50%;color:#fff;font-size:11px;font-weight:800;margin-right:8px;vertical-align:middle}
.bdg{font-style:normal;font-size:11px;font-weight:700;margin-left:8px;padding:2px 8px;border-radius:99px;background:var(--card2);color:var(--gold);vertical-align:middle}.bdg.star{background:none;color:#c58a1d;font-size:15px;padding:0}
.hq{display:flex;gap:8px;padding:8px 2px 0}.hq a{flex:1;min-height:44px;display:grid;place-items:center;border-radius:12px;border:1.5px solid #cdbfb4;background:var(--card);font-size:13px;font-weight:700;text-decoration:none}
.sw--n{overflow:visible}
.hl.rail{border-left:2px solid var(--line);padding-left:12px;margin-left:6px}
.gap{margin:0 0 10px;padding:10px 14px;border:1.5px dashed var(--line);border-radius:14px;color:var(--mut);font-size:13px;font-weight:600;background:transparent}
.emp{text-align:center;padding:28px 12px;color:var(--mut)}.emp__l{display:block;color:var(--accent);opacity:.8;margin-bottom:8px}.emp b{color:var(--fg);font-size:17px}.emp p{margin-bottom:12px}.emp .btn{display:inline-grid;place-items:center;text-decoration:none}
.skel{height:76px;border-radius:16px;margin-bottom:10px;background:linear-gradient(90deg,var(--card2) 25%,var(--card) 50%,var(--card2) 75%);background-size:200% 100%;animation:sk 1.3s infinite linear}
@keyframes sk{to{background-position:-200% 0}}
.hl.fx .sw,.hl.fx .gap,.hl.fx .emp{animation:in .4s cubic-bezier(.22,1,.36,1) both}
.hl.fx>*:nth-child(2){animation-delay:.05s}.hl.fx>*:nth-child(3){animation-delay:.1s}.hl.fx>*:nth-child(4){animation-delay:.15s}
.okpop{position:fixed;inset:0;display:grid;place-items:center;pointer-events:none;z-index:120}.okpop svg{animation:pop .9s ease both}
@keyframes pop{0%{transform:scale(.3);opacity:0}25%{transform:scale(1.1);opacity:1}70%{transform:scale(1);opacity:1}100%{transform:scale(1);opacity:0}}
#toast a{pointer-events:auto;color:#ffd9b8;font-weight:700;margin-left:6px}
.toast.on{pointer-events:auto}
@media (prefers-reduced-motion:reduce){.skel,.hl.fx .sw,.okpop svg{animation:none!important}}
/* ---- dark theme (auto after 18:00) ---- */
html.dark{--night:#231813;--card:#33231c;--card2:#2c1d17;--line:rgba(243,230,216,.16);--fg:#f3e6d8;--mut:rgba(243,230,216,.68);--accent:#e0a15f;--gold:#d9b27a;--ok:#7fb08e;--bad:#e07a62;color-scheme:dark}
html.dark .top{background:rgba(35,24,19,.94)}
html.dark .card,html.dark .hrow,html.dark .wk__d,html.dark .wk__n,html.dark .burger,html.dark .drawer,html.dark .tab,html.dark .btn,html.dark input,html.dark select,html.dark .as__m,html.dark .aspan,html.dark .seg button.on,html.dark .aspan__v,html.dark .hq a,html.dark .btn--bad{background:var(--card)}
html.dark .wk__d.on{background:#f3e6d8;border-color:#f3e6d8;color:#5a463c}html.dark .wk__d.on b{color:#231813}
html.dark .btn,html.dark .burger,html.dark .wk__n,html.dark .hq a,html.dark input,html.dark select{border-color:rgba(243,230,216,.28)}
html.dark .btn--solid,html.dark .asopen{background:var(--accent);border-color:var(--accent);color:#2a1a15}
html.dark .toast{background:#f3e6d8;color:#231813}html.dark #toast a{color:#8c4a24}
html.dark select option{background:#33231c;color:#f3e6d8}
html.dark .greet{background:linear-gradient(135deg,#3a251d,#4b3228)}
html.dark .seg button.on{color:var(--fg)}
</style>

function load(first,fromPoll){

  var slow=first||!lastX||Date.now()-lastX>9e5||(!fromPoll&&(tab==='rev'||tab==='gv'||tab==='off'||tab==='set'));
  var wantQs=!fromPoll&&tab==='qs';

    api('bookings?select=*&starts_at=gte.'+encodeURIComponent(since)+'&order=starts_at.asc',{prefer:'return=representation'}),
    slow?api('blocks?select=*&ends_at=gte.'+encodeURIComponent(new Date().toISOString())+'&order=starts_at.asc',{prefer:'return=representation'}):Promise.resolve(blocks),
    slow?api('settings?id=eq.1&select=*',{prefer:'return=representation'}):Promise.resolve(settings?[settings]:[]),
    slow?api('reviews?select=*&order=created_at.desc&limit=100',{prefer:'return=representation'}).catch(function(){return reviews}):Promise.resolve(reviews),
    slow?api('voucher_requests?select=*&order=created_at.desc&limit=100',{prefer:'return=representation'}).catch(function(){return vouchers}):Promise.resolve(vouchers),
    wantQs?api('chat_questions?select=*&order=asks.desc&limit=200',{prefer:'return=representation'}).catch(function(){return questions}):Promise.resolve(questions)
  ]).then(function(r){

/* egress: every check is one tiny request (the newest change time, about 60 bytes). The full list is only downloaded when something changed. */

  /* voice */
  var mic=$('#asMic'),vb=$('#asVoice');
  function paintVoice(){vb.textContent='Voice replies: '+(voiceOn?'on':'off');vb.setAttribute('aria-pressed',voiceOn)}
  if('speechSynthesis' in window){vb.hidden=false;paintVoice();vb.addEventListener('click',function(){voiceOn=!voiceOn;try{localStorage.setItem('wh_voice',voiceOn?'1':'0')}catch(_){}if(!voiceOn)try{speechSynthesis.cancel()}catch(_){}paintVoice();if(voiceOn)speak('Voice replies are on.')})}

  function fillVoices(){
    if(!('speechSynthesis' in window))return;
    var vs=speechSynthesis.getVoices().filter(function(v){return /^en/i.test(v.lang)});
    if(!vs.length)return;
    var cur=null;try{cur=localStorage.getItem('wh_vname')}catch(_){}
    var sel=$('#asVoiceSel');sel.innerHTML='<option value="">Default voice</option>'+vs.map(function(v){return '<option value="'+esc(v.name)+'"'+(v.name===cur?' selected':'')+'>'+esc(v.name)+' ('+esc(v.lang)+')</option>'}).join('');
    $('#asVoiceRow').hidden=false;
  }
  if('speechSynthesis' in window){fillVoices();speechSynthesis.onvoiceschanged=fillVoices;
    $('#asVoiceSel').addEventListener('change',function(){try{localStorage.setItem('wh_vname',this.value)}catch(_){}voiceOn=true;try{localStorage.setItem('wh_voice','1')}catch(_){}paintVoice();speak('Hello, this is how I will sound.')});
    $('#asRate').addEventListener('change',function(){speak('This is the speaking speed.')})}
  if(SR){
    mic.hidden=false;
    mic.addEventListener('click',function(){
      if(listening){try{recog.stop()}catch(_){}return}
      try{speechSynthesis.cancel()}catch(_){}
      recog=new SR();recog.lang='en-GB';recog.interimResults=true;recog.maxAlternatives=1;
      var finalT='';
      recog.onstart=function(){listening=true;mic.classList.add('on');mic.textContent='Listening...';inp.placeholder='Listening...'};
      recog.onresult=function(e){var t='';for(var i=0;i<e.results.length;i++)t+=e.results[i][0].transcript;inp.value=t;finalT=t};
      recog.onerror=function(e){if(e.error==='not-allowed'||e.error==='service-not-allowed')asSay('Microphone access is blocked. Allow the microphone for this site in your browser settings.');else if(e.error==='no-speech')asSay('I did not hear anything. Tap Speak and try again.');else if(e.error==='network')asSay('Voice needs an internet connection.')};
      recog.onend=function(){listening=false;mic.classList.remove('on');mic.textContent='Speak';inp.placeholder='Type a command, e.g. remind me at 5pm to call Neo';var v=(finalT||inp.value).trim();inp.value='';if(v)runAs(v)};
      try{recog.start()}catch(_){}
    });
  }
  form.addEventListener('submit',function(e){e.preventDefault();var v=inp.value.trim();if(!v)return;inp.value='';runAs(v)});
  pan.addEventListener('click',function(e){var c=e.target.closest('[data-q]');if(c){runAs(c.dataset.q);return}var r=e.target.closest('[data-remind]');if(r){api('bookings?id=eq.'+r.dataset.remind,{method:'PATCH',body:{reminded_at:new Date().toISOString()}}).then(function(){bookings.forEach(function(b){if(String(b.id)===r.dataset.remind)b.reminded_at=new Date().toISOString()});render()}).catch(function(){})}});
})();


/* ---------- side menu: tap the burger, swipe right from the left edge to open, swipe left to close ---------- */
(function(){
  var dr=$('#drawer'),sc=$('#scrim'),bg=$('#burger'),W=function(){return dr.offsetWidth||300},openD=false,drag=null;
  var names={home:'Bookings',new:'Needs action',up:'Upcoming',hist:'History',rev:'Reviews',gv:'Vouchers',qs:'Questions',off:'Time off',set:'Settings'};
  function setD(o){
    openD=o;dr.classList.remove('drag');dr.style.transform='';sc.style.opacity='';
    dr.classList.toggle('open',o);dr.setAttribute('aria-hidden',!o);bg.setAttribute('aria-expanded',o);bg.classList.toggle('on',o);
    if(o){sc.hidden=false;requestAnimationFrame(function(){sc.classList.add('on')})}else{sc.classList.remove('on');setTimeout(function(){if(!openD)sc.hidden=true},260)}
    document.body.style.overflow=o?'hidden':'';
    if(o){var f=dr.querySelector('button.on')||dr.querySelector('button');if(f)setTimeout(function(){f.focus({preventScroll:true})},260)}
  }
  window.whMenu=setD;
  bg.addEventListener('click',function(){setD(!openD)});
  sc.addEventListener('click',function(){setD(false)});
  addEventListener('keydown',function(e){if(e.key==='Escape'&&openD)setD(false)});
  $('#dnav').addEventListener('click',function(e){var b=e.target.closest('[data-go]');if(!b)return;goTab(b.dataset.go);setD(false);scrollTo(0,0)});
  /* keep highlight, counts and title in step with the hidden tab strip */
  function sync(){
    var on=document.querySelector('.tab[aria-selected="true"]');
    if(on){var k=on.dataset.t;$('#topTitle').textContent=k==='home'?new Date().toLocaleDateString('en-GB',{timeZone:TZ,month:'long',year:'numeric'}):(names[k]||'Bookings');document.querySelectorAll('#dnav button').forEach(function(b){b.classList.toggle('on',b.dataset.go===k)})}
    [['cNew','dNew'],['cUp','dUp'],['cRev','dRev'],['cGv','dGv']].forEach(function(p){var v=$('#'+p[0]).textContent.trim();var e=$('#'+p[1]);e.textContent=v;e.hidden=!v});
  }
  new MutationObserver(sync).observe($('#tabs'),{subtree:true,attributes:true,childList:true,characterData:true});sync();
  /* swipe */
  var sx=0,sy=0,t0=0,mode=null;
  function inScroller(el){while(el&&el!==document.body){if(el.scrollWidth>el.clientWidth+4&&/(auto|scroll)/.test(getComputedStyle(el).overflowX))return true;el=el.parentElement}return false}
  document.addEventListener('touchstart',function(e){
    if($('#appView').hidden||e.touches.length!==1)return;
    var t=e.touches[0];sx=t.clientX;sy=t.clientY;t0=Date.now();mode=null;
    if(openD)mode='close';
    else if(sx<=36&&!/INPUT|TEXTAREA|SELECT/.test(e.target.tagName)&&$('#asPanel').hidden&&!inScroller(e.target))mode='open';
  },{passive:true});
  document.addEventListener('touchmove',function(e){
    if(!mode)return;var t=e.touches[0],dx=t.clientX-sx,dy=t.clientY-sy;
    if(!drag){if(Math.abs(dy)>Math.abs(dx)&&Math.abs(dy)>10){mode=null;return}if(Math.abs(dx)<10)return;drag=true;dr.classList.add('drag');sc.hidden=false}
    var w=W(),x=mode==='open'?Math.min(0,-w+dx):Math.min(0,Math.max(-w,dx));
    dr.style.transform='translateX('+x+'px)';sc.style.opacity=String(Math.max(0,Math.min(1,1+x/w)));
  },{passive:true});
  document.addEventListener('touchend',function(e){
    if(!mode||!drag){mode=null;drag=null;return}
    var t=e.changedTouches[0],dx=t.clientX-sx,fast=Date.now()-t0<300&&Math.abs(dx)>40,w=W();
    var open=mode==='open'?(dx>w*.35||fast&&dx>0):!(dx<-w*.25||fast&&dx<0);
    drag=null;mode=null;setD(open);
  });
})();
function enter(){
  api('admins?select=user_id',{prefer:'return=representation'}).then(function(r){
    if(!r||!r.length){$('#loginErr').textContent='This account is not set up as an owner.';signOut();$('#loginErr').textContent='This account is not set up as an owner.';return}
    $('#loginView').hidden=true;$('#appView').hidden=false;
    initApp();$('#asOpen').hidden=false;
    load(true).then(poll);
  }).catch(function(){$('#loginErr').textContent='Could not sign in. Check the address and try again.';signOut()});
}
$('#loginForm').addEventListener('submit',function(e){
  e.preventDefault();$('#loginErr').textContent='';
  var btn=$('#loginBtn');btn.disabled=true;btn.textContent='Signing in';
  try{ctx=ctx||new (window.AudioContext||window.webkitAudioContext)()}catch(_){}
  auth('password',{email:$('#em').value.trim(),password:$('#pw').value}).then(function(j){setSession(j);enter()})
  .catch(function(er){$('#loginErr').textContent=/invalid/i.test(er.message)?'Wrong email or password.':er.message})
  .then(function(){btn.disabled=false;btn.textContent='Sign in'});
});
if(!BACKEND.url||!BACKEND.key){$('#cfgWarn').hidden=false;$('#loginBtn').disabled=true}
else{var sv=loadSaved();if(sv){session=sv;enter()}}
})();
</script>
